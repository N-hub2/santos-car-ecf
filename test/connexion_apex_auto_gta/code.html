<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center relative overflow-hidden antialiased">
<!-- Atmospheric Background Elements -->

<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary-container/5 rounded-full blur-[120px]"></div>

</div>
<!-- Main Content Container -->
<main class="w-full max-w-5xl px-margin-mobile md:px-margin-desktop py-lg z-10 relative flex flex-col items-center">
<!-- Brand Header -->
<div class="mb-xl text-center">
<h1 class="font-display-lg text-primary tracking-tighter uppercase font-black drop-shadow-[0_0_15px_rgba(0,242,255,0.3)]">L'Auto GTA</h1>
<p class="font-body-md text-on-surface-variant mt-sm">Plateforme de gestion de flotte virtuelle</p>
</div>
<!-- Auth Panel -->
<div class="glass-panel w-full max-w-md rounded-xl overflow-hidden shadow-2xl relative">
<!-- Top highlight line -->
<div class="h-1 w-full bg-gradient-to-r from-secondary-container via-primary-container to-secondary-container"></div>
<!-- Tabs -->
<div class="flex border-b border-white/5">
<button class="flex-1 py-md text-center font-label-md text-primary border-b-2 border-primary bg-white/5 transition-all duration-300" id="tab-login" onclick="switchTab('login')">
                    Connexion
                </button>
<button class="flex-1 py-md text-center font-label-md text-on-surface-variant border-b-2 border-transparent hover:text-on-surface hover:bg-white/5 transition-all duration-300" id="tab-register" onclick="switchTab('register')">
                    Inscription
                </button>
</div>
<div class="p-lg relative min-h-[400px]">
<!-- Login Form -->
<form class="space-y-md absolute top-lg left-lg right-lg transition-all duration-500 ease-in-out opacity-100 translate-x-0 pointer-events-auto" id="form-login">
<div class="space-y-sm">
<label class="font-label-md text-on-surface-variant block" for="login-email">Email ou Pseudo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl">person</span>
<input class="w-full bg-[#121214] border border-[#2a2a2e] text-on-surface rounded-lg py-sm pl-xl pr-sm font-body-md input-glow transition-all duration-300 focus:outline-none placeholder:text-white/40" id="login-email" placeholder="joueur@lauto.gta" type="text"/>
</div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant block" for="login-password">Mot de passe</label>
<a class="font-label-md text-primary/80 hover:text-primary transition-colors text-xs" href="#">Oublié ?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl">lock</span>
<input class="w-full bg-[#121214] border border-[#2a2a2e] text-on-surface rounded-lg py-sm pl-xl pr-sm font-body-md input-glow transition-all duration-300 focus:outline-none placeholder:text-white/40" id="login-password" placeholder="••••••••" type="password"/>
</div>
</div>

</button>

</main>
<script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');

            if (tab === 'login') {
                // Show Login
                loginForm.classList.remove('opacity-0', 'translate-x-12', 'pointer-events-none', '-translate-x-12');
                loginForm.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto');
                
                // Hide Register (slide right)
                registerForm.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
                registerForm.classList.add('opacity-0', 'translate-x-12', 'pointer-events-none');

                // Update Tab Styles
                loginTab.classList.add('text-primary', 'border-primary', 'bg-white/5');
                loginTab.classList.remove('text-on-surface-variant', 'border-transparent');
                
                registerTab.classList.remove('text-primary', 'border-primary', 'bg-white/5');
                registerTab.classList.add('text-on-surface-variant', 'border-transparent');

            } else {
                // Hide Login (slide left)
                loginForm.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
                loginForm.classList.add('opacity-0', '-translate-x-12', 'pointer-events-none');
                
                // Show Register
                registerForm.classList.remove('opacity-0', 'translate-x-12', 'pointer-events-none', '-translate-x-12');
                registerForm.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto');

                // Update Tab Styles
                registerTab.classList.add('text-primary', 'border-primary', 'bg-white/5');
                registerTab.classList.remove('text-on-surface-variant', 'border-transparent');
                
                loginTab.classList.remove('text-primary', 'border-primary', 'bg-white/5');
                loginTab.classList.add('text-on-surface-variant', 'border-transparent');
            }
        }
    </script>
