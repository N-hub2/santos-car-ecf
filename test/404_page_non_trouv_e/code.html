            position: absolute;

            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .glitch::before {
            left: 2px;

<script>
        // Simple ambient subtle movement for the glitch text container to make it feel "alive"
        document.addEventListener('DOMContentLoaded', () => {
            const panel = document.querySelector('.glass-panel');
            
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
                
                if(panel) {
                    panel.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                    panel.style.transition = 'transform 0.1s ease-out';
                }
            });

            // Reset transform when mouse leaves window
            document.addEventListener('mouseleave', () => {
                if(panel) {
                    panel.style.transform = `rotateY(0deg) rotateX(0deg)`;
                    panel.style.transition = 'transform 0.5s ease-out';
                }
            });
        });
    </script>
